name: LinkPure
options:
  bundleIdPrefix: com.rxliuli
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LinkPureCore:
    path: .

settings:
  base:
    # 版本号跟着 Flutter 版那条线往下走（App Store 上已发布的是 0.5.1）。
    # Swift 重写不另起一个 1.0。0.6.x 是 Swift 原生版相对线上那版的功能更新。
    # 上传 App Store 时 **不能低于已发布版本**，否则直接被拒。
    # 0.6.1：ASC 里 0.6.0 的 build 600 已经用掉了，而 build number 必须严格递增，
    # 所以补丁版一起往前走。0.6.2：签名/发布流程改成「ASC 靠 cloud signing +
    # 一个合集证书 secret」那一版，而 build 602 已被 ASC 占掉，所以 0.6.3 是同
    # 一份代码的重发（流程改动不产生代码差异）。
    MARKETING_VERSION: "0.6.3"
    # build number 用 Flutter 仓库 CI 里那条公式：x*10000 + y*100 + z
    #（0.6.3 → 6*100+3 = 603）。发版时 release.yml 会按版本号算出来覆盖本值，
    # 这里的 603 只是给本机 Xcode archive 用的默认值，两者要保持一致。
    CURRENT_PROJECT_VERSION: "603"
    # Info.plist 的 `NSHumanReadableCopyright` 用这个变量（会显示在 macOS 的「关于」面板）。
    # 原来沿用 Flutter 版的值是 `Copyright © 2025 com.rxliuli. …`——
    # 把 bundle id 写进用户可见的版权声明里不合适，换成 App Store 上的卖家名，年份也改成当前。
    PRODUCT_COPYRIGHT: "Copyright © 2026 KAI WANG. All rights reserved."
    SWIFT_VERSION: "5.0"
    # Xcode 的「Update to recommended settings」会反复提示下面两项，就是因为工程里没写，
    # 它每次都认为工程落后于当前模板。写在这里才治本——`.xcodeproj` 是 xcodegen 的产物、
    # 且已在 .gitignore 里，点那个按钮改的是**产物**，下次 generate 就没了；
    # 更麻烦的是若带着被改过的工程去 Archive，产物会带上源码里不存在的设置，构建不可复现。
    #
    # 死代码剥离：Release 不剥离的话，未被引用的代码会留在包里。
    # 之前 macOS 两个配置都是 NO（iOS 反而是 YES），发货配置因此白白变大。
    DEAD_CODE_STRIPPING: YES
    # 用户脚本沙盒：本工程没有任何 run script 阶段（Scripts/sync-spec.sh 存在但
    # 没接进 project.yml），所以现在开关它不改变任何行为。写上是给将来立规矩——
    # 一旦加了脚本，就只能读写自己声明的输入输出。
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 让编译器把 SwiftUI 的 Text("…") 之类抽成 .stringsdata，
    # Xcode 构建时再自动同步进 Apps/Shared/Localizable.xcstrings。
    # 不打开的话字面量还是能跑，但目录永远不更新。
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # 必须用真实签名（不能是 ad-hoc）：macOS 不给 ad-hoc 签名的 app 发通知权限。
    DEVELOPMENT_TEAM: N2X78TUUFG

targets:
  # ---------------------------------------------------------------- macOS
  LinkPureMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - package: LinkPureCore
        product: LinkPureCore
    entitlements:
      path: Apps/macOS/LinkPureMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        # PRODUCT_NAME 默认取 target 名（LinkPureMac / LinkPureIOS），
        # 会连带影响：.app 文件名、CFBundleName、CFBundleExecutable。
        # 而 CFBundleDisplayName 只能覆盖 Finder / 主屏的显示名——
        # 登录项列表显示的是 .app 文件名，iOS 部分系统界面用 CFBundleName，
        # 所以必须显式把 PRODUCT_NAME 固定成 LinkPure。
        PRODUCT_NAME: LinkPure
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.linkpure2.dev
        INFOPLIST_FILE: Apps/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox 开启（上架 Mac App Store 的硬性要求）。
        # 已验证剪贴板轮询在沙盒下可用（Flutter 版就是沙盒的）。
        # 副作用：跨 app 的 preferences 扫描会被拒（迁移会退化为只查 UserDefaults）。
        ENABLE_APP_SANDBOX: YES
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.linkpure2

  # ---------------------------------------------------------------- iOS
  LinkPureIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - package: LinkPureCore
        product: LinkPureCore
    settings:
      base:
        PRODUCT_NAME: LinkPure
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.linkpure2.dev
        INFOPLIST_FILE: Apps/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # 一定要写在 **iOS target** 这一层：XcodeGen 对 iOS 会硬编码注入
        # CODE_SIGN_IDENTITY = "iPhone Developer"（写死在它的 Swift 源码里，不在
        # SettingPresets/*.yml，所以只在目标级设置能盖掉它）——那是个早已不存在的
        # 身份名，自动签名解析不到就会去 Apple 申请一张新的 Apple Development 证书，
        # 一次一张、私钥随 runner 销毁，直到撞上账号上限。
        # 写成现代的名字，跟 imp-rec 那个手写工程里的取值一致。
        # 注：macOS 那侧 XcodeGen 不会注入，Xcode 的默认值本来就是 Apple Development，
        # 所以不必多写一行。
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.linkpure2

schemes:
  LinkPureMac:
    build:
      targets:
        LinkPureMac: all
    run:
      config: Debug
  LinkPureIOS:
    build:
      targets:
        LinkPureIOS: all
    run:
      config: Debug
