name: CI

# main 现在是 Swift 原生版的开发主线（Flutter 版已备份到 flutter 分支），
# 所以直接监听 main。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推几次时，只有最后一次的结果有意义
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────── 版本号一致性 ─────────────────────────
  # Apple 与 Android 的版本号都必须从 project.yml 派生（公式 x*10000 + y*100 + z）。
  # 这个 job 只跑几秒，但能挡住两端版本号漂移——那种漂移只会在发版时以
  # App Store / Play 拒收的形式暴露出来（今天刚被 ASC 用 409 拒过一次）。
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ./Scripts/check-version.sh
        run: ./Scripts/check-version.sh

  # ───────────────────────── 发布脚本的语法 ─────────────────────────
  # Scripts/ 下的脚本只在 40 分钟一趟、还要烧 macOS runner 额度的发布流程里才会被
  # 真正执行——错一个 `fi` 要等一次发版才发现，太贵了。所以在这里先过一遍语法
  # （所有脚本一起）。发布用的共享 action 自己那边也跑同样的检查。
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash -n
        run: |
          for f in Scripts/*.sh; do
            echo "── $f"
            bash -n "$f"
          done

  # ───────────────────────── 规则引擎 ─────────────────────────
  # 规则库 + conformance 向量是全仓库唯一一份「跨语言数据契约」，
  # Swift 与 Kotlin 两个实现跑的是同一批 1053 条向量——这里跑的就是它。
  # 两条都放 ubuntu（最快最便宜的 runner）：LinkPureCore 只依赖 Foundation，
  # Android :core 是刻意的纯 JVM 模块。
  swift-core:
    name: Swift core / 1053 vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: swift test
        run: |
          swift --version
          swift test

  android-core:
    name: Kotlin core / 1053 vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # 不需要装 Android SDK：:core 是纯 JVM 模块，而且 AGP 9 的
      # `compileSdk { version = release(37) }` 是惰性的，配置 :app 不会去要 SDK。
      # （本机把 local.properties 挪走、ANDROID_HOME 指向空目录验过。）
      - name: ./gradlew :core:test
        working-directory: Apps/android
        run: ./gradlew :core:test --console=plain

  # ───────────────────────── Android app 编译检查 ─────────────────────────
  # android-core 只跑 :core 的 1053 条向量（纯 JVM，连 Android SDK 都不用）。
  # :app 那上千行 Compose 不在它的覆盖范围里——少了这个 job，改 RulesScreen.kt
  # 也能全绿。跟上面 macOS/iOS 的 apps-compile 是同一个理由。
  android-app:
    name: Build Android app (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # 只编 debug：签名密钥是发布 job 的事，PR 不该碰到它
      - name: ./gradlew :app:assembleDebug
        working-directory: Apps/android
        run: ./gradlew :app:assembleDebug --console=plain

  # ───────────────────────── App 层编译检查 ─────────────────────────
  # `swift test` 只编译 SwiftPM 里的 LinkPureCore。Apps/Shared 下那上千行
  # SwiftUI（以及 macOS / iOS 两个 target）不在任何 SwiftPM target 里，
  # 只有 xcodebuild 编译得到——少了这个 job，改 RuleEditorView.swift 也能全绿。
  apps-compile:
    name: Build apps (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # .xcodeproj 是 xcodegen 的产物、且在 .gitignore 里，CI 上必须现生成。
      # （project.yml 才是工程配置的唯一来源。）
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # 只做编译检查。签名证书 / 描述文件 / 上传 App Store 都是发布 job 的事，
      # 跟 PR 无关，也不该让 PR 拿到那些 secret。
      - name: Build macOS
        run: |
          # 用 generic/platform 而不是 platform=macOS：后者会在 arm64 / x86_64
          # 两个 destination 里挑第一个（只编 arm64，还打一行 warning）。
          # 本 app 要上 Mac App Store，必须 universal（已验证 generic/platform
          # 产出的二进制是 x86_64 + arm64）。
          xcodebuild -project LinkPure.xcodeproj \
            -scheme LinkPureMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build iOS
        run: |
          xcodebuild -project LinkPure.xcodeproj \
            -scheme LinkPureIOS \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
