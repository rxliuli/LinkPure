name: Release

# 版本号（MARKETING_VERSION）和 build 号（CURRENT_PROJECT_VERSION）都写在 project.yml，
# 所以它就是这条流水线唯一的输入：改 project.yml 里的版本 → 自动发一版。
#
# 只在版本**真的变了**时才发布（build 号单独变不算——那是重传同一版本号的情况，
# 走 workflow_dispatch 并覆盖 build-number）。
on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: 真正上传 ASC / 发 GitHub Release / 更新 cask（不勾只演练到「能通过 Apple 的校验」为止）
        type: boolean
        default: false
      build-number:
        description: 覆盖 CFBundleVersion（留空 = 按版本号自动算：x*10000 + y*100 + z）
        type: string
        default: ""
      play-track:
        description: Google Play 轨道（internal / alpha / beta / production）；留空 = internal
        type: string
        default: ""

# 两个 release 同时跑会抢同一个 tag 和同一个 cask 文件
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ───────────────────────── 解析版本 ─────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ steps.read.outputs.build_number }}
      run: ${{ steps.read.outputs.run }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # 用仓库自己的 action 读 XcodeGen 的 project.yml（format 会自动识别成 xcodegen）
      - id: check
        uses: rxliuli/version-check@v1
        with:
          file: project.yml

      - id: read
        name: Resolve build number and whether to publish
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::没能从 project.yml 里读到 MARKETING_VERSION"
            exit 1
          fi

          # 只有版本变了才发；手动触发（重传/重试）永远跑
          RUN=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.check.outputs.changed }}" == "true" ]]; then
            RUN=true
          fi

          # 演练开关：push 触发时总是真发，手动触发时听输入
          PUBLISH=false
          if [[ "$RUN" == "true" ]] && { [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.publish }}" == "true" ]]; }; then
            PUBLISH=true
          fi

          # build number 默认按版本号算，跟 Flutter repo 的 CI 用同一个公式
          # （x*10000 + y*100 + z，0.6.1 → 601）。这样“改版本号”就是发版唯一的动作，
          # 不必再去 project.yml 里同步一个数字；两套实现映射出同一个 build number，
          # App Store 才不会当成重复或倒序。
          # 同一个版本要重传时（该 build number 已被 ASC 占掉），用 workflow_dispatch
          # 的 build-number 输入覆盖。
          BUILD_NUMBER="${{ inputs.build-number }}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build number 算出的是 '$BUILD_NUMBER'（版本号 $VERSION 不是 x.y.z 形式？）"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "run=${RUN}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}  build=${BUILD_NUMBER}  run=${RUN}  publish=${PUBLISH}"

  # ───────────────────────── App Store Connect（macOS + iOS） ─────────────────────────
  # 归档 → 导出 → 校验 →（可选）上传，全部交给共享 action：
  # https://github.com/rxliuli/apple-release —— 里面的规则（归档阶段为什么不签名、
  # app 的签名身份为什么来自 cloud signing、为什么必须先导入合集证书、加密钥为什么
  # 要补 base64 padding）在那边的 README 与 scripts/asc.sh 里有完整说明，这里不再
  # 复制一遍：注释复制到各处就会各自漂移，这正是当初要抽出去的原因。
  #
  # 两个平台仍然是一个 matrix：差别只剩 scheme，平台语义由 action 的 platform 输入承载。
  # iOS 是可选的 —— 不想要就在 matrix 里删掉那一项。
  appstore:
    name: ${{ matrix.platform }} → App Store Connect
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    environment: release-macOS
    strategy:
      # 一个平台挂了，另一个的结果也要看得到
      fail-fast: false
      matrix:
        include:
          - platform: macos
            scheme: LinkPureMac
          - platform: ios
            scheme: LinkPureIOS
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # release=false 时只演练到通过 Apple 的校验为止（不上传）。注意演练也会真去
      # 问 Apple：同一个 version + build-number 传过之后，演练会失败在 ASC 的重复
      # 校验上（ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE），重发要换 build 号。
      - uses: rxliuli/apple-release/asc@v1
        with:
          platform: ${{ matrix.platform }}
          scheme: ${{ matrix.scheme }}
          project: LinkPure.xcodeproj
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          team-id: ${{ vars.TEAM_ID }}
          release: ${{ needs.version.outputs.publish }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  # ───────────────────────── macOS → 公证过的 DMG ─────────────────────────
  # 直发渠道（Homebrew / GitHub Release）。规则与"为什么"都在共享 action 那边：
  # https://github.com/rxliuli/apple-release —— 与上架那条路最大的不同是它必须
  # 本地持有一张有效的 Developer ID 证书（直发不嵌 profile，没有托管身份可依赖），
  # 所以那边会显式钉住签名身份。
  macos-dmg:
    name: macOS → notarized DMG
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-macOS
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # 产物默认叫 <App>-macos.dmg（= LinkPure-macos.dmg，cask 的 url 依赖这个名字），
      # 落在 build/apple-release/ 下，路径由 dmg-path 输出。
      - uses: rxliuli/apple-release/dmg@v1
        id: dmg
        with:
          project: LinkPure.xcodeproj
          scheme: LinkPureMac
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          signing-identity: ${{ vars.SIGNING_IDENTITY_DMG }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.dmg-path }}
          if-no-files-found: error

  # ───────────────────────── Android → Google Play ─────────────────────────
  # 不需要 macOS：Android 那条路全是 Linux 上的 Gradle 活。
  #
  # 版本号不在这里维护：Apps/android/app/build.gradle.kts 从仓库根的 project.yml 派生
  # versionName / versionCode（跟 Apple 侧 build number 同一个公式），
  # Scripts/check-version.sh 盯着"不许在 Android 侧再写一份"。
  #
  # 上传密钥复用 Flutter 版一直在用的那个 upload-keystore.jks —— Play 要求同一个
  # package name 用同一个 upload key，换了就永远无法更新，只能另开一个 app。
  #
  # 默认发到 **internal** 轨道（秒级生效、不进审核），确认没问题再用
  # `workflow_dispatch -f play-track=production` 发正式版。
  android:
    name: Android → Google Play
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: build-android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > Apps/android/upload-keystore.jks
          cat > Apps/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build AAB + APK
        working-directory: Apps/android
        run: ./gradlew :app:bundleRelease :app:assembleRelease --console=plain

      # 未签名或签错密钥的包 Play 一律拒收，所以当场验一遍——比上传后拿一个
      # 服务端的抽象报错便宜得多
      - name: Verify the APK signature
        working-directory: Apps/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Rename artifacts
        run: |
          mv Apps/android/app/build/outputs/bundle/release/app-release.aab LinkPure-android.aab
          mv Apps/android/app/build/outputs/apk/release/app-release.apk LinkPure-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            LinkPure-android.aab
            LinkPure-android.apk
          if-no-files-found: error

      # Play 的发布凭据（服务账号 JSON）需要单独在 Play Console 里建，见 Apps/android/README.md。
      # 没配就跳过并留下一条 warning，而不是把整条发布判红——其它渠道（Apple / DMG / cask）
      # 与它互不相关。
      - name: Check Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON 未配置 —— 跳过 Play 上传（AAB/APK 仍然产出了）；配置步骤见 Apps/android/README.md"
            {
              echo "### Play 上传已跳过"
              echo
              echo "缺少 \`PLAY_SERVICE_ACCOUNT_JSON\`（Play Developer API 服务账号 JSON）。"
              echo "配置步骤见 \`Apps/android/README.md\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rxliuli.linkpure
          releaseFiles: LinkPure-android.aab
          track: ${{ inputs.play-track || 'internal' }}
          status: completed

  # ───────────────────────── GitHub Release + Homebrew cask ─────────────────────────
  release:
    name: GitHub Release + Homebrew cask
    needs: [version, appstore, macos-dmg]
    # always()：needs 里有被跳过的 job 时，不加它就整个跳过
    if: >-
      always()
      && needs.version.outputs.publish == 'true'
      && needs.appstore.result == 'success'
      && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    environment: release-macOS
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${TAG} 已存在，只替换 DMG"
            gh release upload "$TAG" LinkPure-macos.dmg --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --generate-notes \
              --repo "${{ github.repository }}" \
              LinkPure-macos.dmg
          fi

      - uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: linkpure
          version: ${{ needs.version.outputs.version }}
          artifact: LinkPure-macos.dmg
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
