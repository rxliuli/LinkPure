name: Release

# 版本号（MARKETING_VERSION）和 build 号（CURRENT_PROJECT_VERSION）都写在 project.yml，
# 所以它就是这条流水线唯一的输入：改 project.yml 里的版本 → 自动发一版。
#
# 只在版本**真的变了**时才发布（build 号单独变不算——那是重传同一版本号的情况，
# 走 workflow_dispatch 并覆盖 build-number）。
on:
  push:
    branches: [feat/swift-native]
    paths: [project.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: 真正上传 ASC / 发 GitHub Release / 更新 cask（不勾只演练到「能通过 Apple 的校验」为止）
        type: boolean
        default: false
      build-number:
        description: 覆盖 CFBundleVersion（留空 = 按版本号自动算：x*10000 + y*100 + z）
        type: string
        default: ""

# 两个 release 同时跑会抢同一个 tag 和同一个 cask 文件
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ───────────────────────── 解析版本 ─────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ steps.read.outputs.build_number }}
      run: ${{ steps.read.outputs.run }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # 用仓库自己的 action 读 XcodeGen 的 project.yml（format 会自动识别成 xcodegen）
      - id: check
        uses: rxliuli/version-check@v1
        with:
          file: project.yml

      - id: read
        name: Resolve build number and whether to publish
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::没能从 project.yml 里读到 MARKETING_VERSION"
            exit 1
          fi

          # 只有版本变了才发；手动触发（重传/重试）永远跑
          RUN=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.check.outputs.changed }}" == "true" ]]; then
            RUN=true
          fi

          # 演练开关：push 触发时总是真发，手动触发时听输入
          PUBLISH=false
          if [[ "$RUN" == "true" ]] && { [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.publish }}" == "true" ]]; }; then
            PUBLISH=true
          fi

          # build number 默认按版本号算，跟 Flutter repo 的 CI 用同一个公式
          # （x*10000 + y*100 + z，0.6.1 → 601）。这样“改版本号”就是发版唯一的动作，
          # 不必再去 project.yml 里同步一个数字；两套实现映射出同一个 build number，
          # App Store 才不会当成重复或倒序。
          # 同一个版本要重传时（该 build number 已被 ASC 占掉），用 workflow_dispatch
          # 的 build-number 输入覆盖。
          BUILD_NUMBER="${{ inputs.build-number }}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build number 算出的是 '$BUILD_NUMBER'（版本号 $VERSION 不是 x.y.z 形式？）"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "run=${RUN}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}  build=${BUILD_NUMBER}  run=${RUN}  publish=${PUBLISH}"

  # ───────────────────────── App Store Connect（macOS + iOS） ─────────────────────────
  # 归档 → 导出 → 校验 →（可选）上传，全部交给共享 action：
  # https://github.com/rxliuli/apple-release —— 里面的规则（归档阶段为什么不签名、
  # app 的签名身份为什么来自 cloud signing、为什么必须先导入合集证书、加密钥为什么
  # 要补 base64 padding）在那边的 README 与 scripts/asc.sh 里有完整说明，这里不再
  # 复制一遍：注释复制到各处就会各自漂移，这正是当初要抽出去的原因。
  #
  # 两个平台仍然是一个 matrix：差别只剩 scheme，平台语义由 action 的 platform 输入承载。
  # iOS 是可选的 —— 不想要就在 matrix 里删掉那一项。
  appstore:
    name: ${{ matrix.platform }} → App Store Connect
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    environment: release-macOS
    strategy:
      # 一个平台挂了，另一个的结果也要看得到
      fail-fast: false
      matrix:
        include:
          - platform: macos
            scheme: LinkPureMac
          - platform: ios
            scheme: LinkPureIOS
    steps:
      - uses: actions/checkout@v6

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # release=false 时只演练到通过 Apple 的校验为止（不上传）。注意演练也会真去
      # 问 Apple：同一个 version + build-number 传过之后，演练会失败在 ASC 的重复
      # 校验上（ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE），重发要换 build 号。
      - uses: rxliuli/apple-release/asc@v1
        with:
          platform: ${{ matrix.platform }}
          scheme: ${{ matrix.scheme }}
          project: LinkPure.xcodeproj
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          team-id: ${{ vars.TEAM_ID }}
          release: ${{ needs.version.outputs.publish }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  # ───────────────────────── macOS → 公证过的 DMG ─────────────────────────
  # 直发渠道（Homebrew / GitHub Release）。跟上一条最大的不同是签名身份：
  # Developer ID + hardened runtime + 公证，**不嵌任何 provisioning profile**
  # （所以这里 manual 签名是合法的——上架那条路上的托管 profile 才是麻烦所在）。
  macos-dmg:
    name: macOS → notarized DMG
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-macOS
    steps:
      - uses: actions/checkout@v6

      # 跟 appstore 那两个平台共用同一份准备逻辑（Scripts/ci-signing.sh）和同一个
      # 合集 secret；区别只是这里真的拿里面的 Developer ID 身份去签名。
      # vars.SIGNING_IDENTITY_DMG 从原来的「唯一真相」降级成一道断言（它必须跟
      # 导入进来的证书对得上），真正的身份名由脚本从 keychain 里读出来，
      # 供下面的 archive / create-dmg 使用——两处不再需要手动保持一致。
      - name: Setup signing keychain
        env:
          SIGNING_IDENTITY_DMG: ${{ vars.SIGNING_IDENTITY_DMG }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: ./Scripts/ci-signing.sh setup --expect "${SIGNING_IDENTITY_DMG}" APPLE_CERTIFICATE_BASE64

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # SIGNING_IDENTITY 由上面的脚本导出（= keychain 里那个 Developer ID 证书的全名）
      - name: Archive with Developer ID
        run: |
          # 这里**不能**传 PROVISIONING_PROFILE_SPECIFIER：它是全局构建设置，
          # 会连 SwiftPM 的 LinkPureCore_LinkPureCore 资源包一起要求 profile
          # （那是纯资源包，不支持 profile）。
          xcodebuild archive \
            -project LinkPure.xcodeproj \
            -scheme LinkPureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/dmg.xcarchive \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}"

      - name: Verify the archived app
        run: |
          APP=$(find build/dmg.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier=|flags='
          # 上 Mac App Store 要 universal；这个渠道也一并保持一致
          lipo -info "$APP/Contents/MacOS/$(basename "$APP" .app)"

      - name: Create DMG
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          APP=$(find build/dmg.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg
          create-dmg \
            --volname "LinkPure" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "$(basename "$APP")" 180 170 \
            --hide-extension "$(basename "$APP")" \
            --app-drop-link 480 170 \
            --codesign "${SIGNING_IDENTITY}" \
            "LinkPure-macos.dmg" \
            "$APP"
          codesign --verify --verbose=2 LinkPure-macos.dmg

      - name: Notarize and staple
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit LinkPure-macos.dmg \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait
          xcrun stapler staple LinkPure-macos.dmg
          # 盖章是真的成功了，而不是 notarytool 说成功
          xcrun stapler validate LinkPure-macos.dmg
          # Gatekeeper 的最终判定。放在这里当"附加证据"而不是硬门：
          # runner 上的 assess 守护进程状态偶尔会给出假阴性，而 stapler validate 已经过了。
          spctl -a -t open --context context:primary-signature -v LinkPure-macos.dmg \
            || echo "::warning::spctl 未通过（stapler validate 已通过，通常是 runner 上的 Gatekeeper 状态问题）"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: LinkPure-macos.dmg
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: ./Scripts/ci-signing.sh teardown

  # ───────────────────────── GitHub Release + Homebrew cask ─────────────────────────
  release:
    name: GitHub Release + Homebrew cask
    needs: [version, appstore, macos-dmg]
    # always()：needs 里有被跳过的 job 时，不加它就整个跳过
    if: >-
      always()
      && needs.version.outputs.publish == 'true'
      && needs.appstore.result == 'success'
      && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    environment: release-macOS
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${TAG} 已存在，只替换 DMG"
            gh release upload "$TAG" LinkPure-macos.dmg --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --generate-notes \
              --repo "${{ github.repository }}" \
              LinkPure-macos.dmg
          fi

      - uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: linkpure
          version: ${{ needs.version.outputs.version }}
          artifact: LinkPure-macos.dmg
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
