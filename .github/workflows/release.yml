name: Release

# 版本号（MARKETING_VERSION）和 build 号（CURRENT_PROJECT_VERSION）都写在 project.yml，
# 所以它就是这条流水线唯一的输入：改 project.yml 里的版本 → 自动发一版。
#
# 只在版本**真的变了**时才发布（build 号单独变不算——那是重传同一版本号的情况，
# 走 workflow_dispatch 并覆盖 build-number）。
on:
  push:
    branches: [feat/swift-native]
    paths: [project.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: 真正上传 ASC / 发 GitHub Release / 更新 cask（不勾只演练到「能通过 Apple 的校验」为止）
        type: boolean
        default: false
      build-number:
        description: 覆盖 CFBundleVersion（留空 = 按版本号自动算：x*10000 + y*100 + z）
        type: string
        default: ""

# 两个 release 同时跑会抢同一个 tag 和同一个 cask 文件
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ───────────────────────── 解析版本 ─────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ steps.read.outputs.build_number }}
      run: ${{ steps.read.outputs.run }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # 用仓库自己的 action 读 XcodeGen 的 project.yml（format 会自动识别成 xcodegen）
      - id: check
        uses: rxliuli/version-check@v1
        with:
          file: project.yml

      - id: read
        name: Resolve build number and whether to publish
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::没能从 project.yml 里读到 MARKETING_VERSION"
            exit 1
          fi

          # 只有版本变了才发；手动触发（重传/重试）永远跑
          RUN=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.check.outputs.changed }}" == "true" ]]; then
            RUN=true
          fi

          # 演练开关：push 触发时总是真发，手动触发时听输入
          PUBLISH=false
          if [[ "$RUN" == "true" ]] && { [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.publish }}" == "true" ]]; }; then
            PUBLISH=true
          fi

          # build number 默认按版本号算，跟 Flutter repo 的 CI 用同一个公式
          # （x*10000 + y*100 + z，0.6.1 → 601）。这样“改版本号”就是发版唯一的动作，
          # 不必再去 project.yml 里同步一个数字；两套实现映射出同一个 build number，
          # App Store 才不会当成重复或倒序。
          # 同一个版本要重传时（该 build number 已被 ASC 占掉），用 workflow_dispatch
          # 的 build-number 输入覆盖。
          BUILD_NUMBER="${{ inputs.build-number }}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build number 算出的是 '$BUILD_NUMBER'（版本号 $VERSION 不是 x.y.z 形式？）"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "run=${RUN}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}  build=${BUILD_NUMBER}  run=${RUN}  publish=${PUBLISH}"

  # ───────────────────────── App Store Connect（macOS + iOS） ─────────────────────────
  # 两个平台合成一个 matrix：它们之间只差 scheme / destination / 上传类型 / 产物后缀。
  # 以前是两份 200 行的复制品，而其中 keychain 那 40 行已经漂移过好几次（丢过
  # mkdir ~/private_keys、在空 keychain 上跑 set-key-partition-list……），
  # 所以那部分逻辑现在只有一份：Scripts/ci-signing.sh。
  #
  # 签名走 extport（imp-write / scrub 那套）的模式：把自备的 Apple Distribution
  # 证书塞进临时 keychain，剩下的交给 Xcode —— `CODE_SIGN_STYLE=Automatic` +
  # `-allowProvisioningUpdates` + ASC API key 会自己按 bundle id 找到/更新
  # profile，所以**不需要**任何 profile 文件，也没有 IOS_/MACOS_PROVISIONING_PROFILE
  # 这两个 secret。
  #
  # 相对 extport 只多一件事：把归档的签名身份钉死。原来自动签名归档会向 Xcode
  # 要一张 Apple **Development** 证书（日志里是 "Apple Development: Created via API"），
  # 每跑一次新造一张，几天就撞满 Apple 的证书上限。现在 keychain 里只有我们自己
  # 塞进去的那张 app 分发证书（脚本读出它的全名导出成 SIGNING_IDENTITY，
  # 用 CODE_SIGN_IDENTITY 精确指定），Xcode 只能用那张：要么成功，要么当场失败，
  # 不会再静默地造一张。
  #
  # 顺带删掉「归档不签名」那个补丁：之前 macOS 靠 ad-hoc 签（identity "-"）、
  # iOS 干脆 CODE_SIGNING_ALLOWED=NO，理由就是上面那个造证书的问题。但那样归档
  # 出来的不是你要发的产物——entitlements 是跟着签名走的，不签就只能靠 ad-hoc
  # 把 sandbox/network/files「偷渡」进归档，再指望 exportArchive 重签时合并回去。
  # 现在归档就是真签名的，那层夹心没必要存在了。
  appstore:
    name: ${{ matrix.platform }} → App Store Connect
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    environment: release-macOS
    strategy:
      # 一个平台挂了，另一个的结果也要看得到
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            scheme: LinkPureMac
            destination: generic/platform=macOS
            # altool 的 --type，同时也是「要不要额外验 .pkg 签名」的开关
            upload_type: macos
            artifact: '*.pkg'
            # Mac App Store 的 .pkg 由 productbuild 用 installer 证书签，
            # 所以 macOS 比 iOS 多一张证书。
            certs: [APPLE_CERTIFICATE_APPSTORE_BASE64, APPLE_CERTIFICATE_INSTALLER_BASE64]
          - platform: iOS
            scheme: LinkPureIOS
            destination: generic/platform=iOS
            upload_type: ios
            artifact: '*.ipa'
            certs: [APPLE_CERTIFICATE_APPSTORE_BASE64]
    steps:
      - uses: actions/checkout@v6

      # keychain + 证书 + ASC API key 全部由这一个脚本负责（三个 job 共用），
      # 它带两道闸：① 导入后必须真的出现可用签名身份（p12 里只有证书没私钥的话，
      # 自动签名会转身去 Apple 申请一张新的）；② 断言这份证书确实是 app 签名证书，
      # 然后把它的全名导出成 SIGNING_IDENTITY，供下面精确钉住。
      # 这里不写死 "Apple Distribution"：Mac App Store 的 app 证书有新旧两套名字
      # （Apple Distribution ↔ 老的 3rd Party Mac Developer Application），
      # secret 里到底是哪张不该由 workflow 猜，但两个名字都接受。
      - name: Setup signing keychain
        env:
          APPLE_CERTIFICATE_APPSTORE_BASE64: ${{ secrets.APPLE_CERTIFICATE_APPSTORE_BASE64 }}
          APPLE_CERTIFICATE_APPSTORE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_APPSTORE_PASSWORD }}
          APPLE_CERTIFICATE_INSTALLER_BASE64: ${{ secrets.APPLE_CERTIFICATE_INSTALLER_BASE64 }}
          APPLE_CERTIFICATE_INSTALLER_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_INSTALLER_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          ./Scripts/ci-signing.sh setup \
            --expect "Apple Distribution" \
            --expect "3rd Party Mac Developer Application" \
            ${{ join(matrix.certs, ' ') }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # 真签名归档（不再是 ad-hoc / 不签）。`-allowProvisioningUpdates` 在这里
      # 仍然必要：我们不带 profile 文件，profile 是 Xcode 通过 API key 现取/现更新的。
      - name: Archive (automatic signing)
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project LinkPure.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -archivePath build/${{ matrix.platform }}.xcarchive \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.build_number }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      # 归档产物自己就是真签名 + 带 entitlements 的——这正是删掉 ad-hoc 补丁之后
      # 要守住的那条不变量，所以在这里当场断言，而不是等 ASC 几分钟后用 90296 拒收。
      - name: Verify the archive is really signed
        run: |
          APP=$(find build/${{ matrix.platform }}.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier='
          # 以前这里是 ad-hoc（identity "-"）或者干脆没签，归档产物跟真正发给 ASC 的
          # 东西不是一回事（entitlements 得靠 ad-hoc 偷渡）。这条断言就把新的不变量
          # 钉住了：必须是我们那张 app 分发证书签的，不是 Xcode 现场造的开发证书。
          codesign -dv --verbose=2 "$APP" 2>&1 \
            | grep -Eq 'Authority=(Apple Distribution|3rd Party Mac Developer Application)' \
            || { echo '::error::归档里的 app 不是用 app 分发证书签的（自动签名又绕开 keychain 造了一张？）'; exit 1; }
          codesign -d --entitlements - --xml "$APP" | plutil -p -
          if [ '${{ matrix.upload_type }}' = macos ]; then
            # entitlements 跟着签名走：不签就丢 sandbox（ASC 报 90296）。
            # 这条断言是防止那个补丁被重新引入的。
            codesign -d --entitlements - --xml "$APP" | plutil -p - | grep -q 'com.apple.security.app-sandbox' \
              || { echo '::error::归档里的 app 缺 app-sandbox entitlement'; exit 1; }
          fi

      - name: Export
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          # manageAppVersionAndBuildNumber=false 关掉「导出时自动 +1 build 号」——
          # 默认开着的话 Xcode 会把我们指定的 601 改成 602，发布就不可复现了。
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          # 归档已经真签过了，这一步只负责换成「distribution profile + installer
          # 证书」那一套重签并打包（.pkg / .ipa）。profile 依旧由 Xcode 自己按
          # bundle id 现取，我们没有也不需要 profile 文件。
          xcodebuild -exportArchive \
            -archivePath build/${{ matrix.platform }}.xcarchive \
            -exportPath build/export-${{ matrix.platform }} \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      - name: Show what got signed
        run: |
          EXPORT=build/export-${{ matrix.platform }}
          ARTIFACT=$(find "$EXPORT" -name '${{ matrix.artifact }}' | head -1)
          echo "artifact: $ARTIFACT"
          if [ '${{ matrix.upload_type }}' = macos ]; then
            pkgutil --check-signature "$ARTIFACT"
          fi
          # DistributionSummary 里能看到实际用的证书、profile、entitlements 和
          # build 号，出问题时这一行就是最有用的线索
          plutil -p "$EXPORT/DistributionSummary.plist"

      - name: Validate with App Store Connect
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ARTIFACT=$(find build/export-${{ matrix.platform }} -name '${{ matrix.artifact }}' | head -1)
          xcrun altool --validate-app --type ${{ matrix.upload_type }} --file "$ARTIFACT" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$API_ISSUER"

      - name: Upload to App Store Connect
        if: needs.version.outputs.publish == 'true'
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ARTIFACT=$(find build/export-${{ matrix.platform }} -name '${{ matrix.artifact }}' | head -1)
          xcrun altool --upload-app --type ${{ matrix.upload_type }} --file "$ARTIFACT" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$API_ISSUER"

      - name: Cleanup keychain
        if: always()
        run: ./Scripts/ci-signing.sh teardown

  # ───────────────────────── macOS → 公证过的 DMG ─────────────────────────
  # 直发渠道（Homebrew / GitHub Release）。跟上一条最大的不同是签名身份：
  # Developer ID + hardened runtime + 公证，**不嵌任何 provisioning profile**
  # （所以这里 manual 签名是合法的——上架那条路上的托管 profile 才是麻烦所在）。
  macos-dmg:
    name: macOS → notarized DMG
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-macOS
    steps:
      - uses: actions/checkout@v6

      # 跟 appstore 那两个平台共用同一份准备逻辑（Scripts/ci-signing.sh），
      # 只是证书换成 Developer ID。vars.SIGNING_IDENTITY_DMG 从原来的「唯一真相」
      # 降级成一道断言（它必须跟导入进来的证书对得上），真正的身份名由脚本从
      # keychain 里读出来，供下面的 archive / create-dmg 使用——两处不再需要手动保持一致。
      - name: Setup signing keychain
        env:
          SIGNING_IDENTITY_DMG: ${{ vars.SIGNING_IDENTITY_DMG }}
          APPLE_CERTIFICATE_DEVELOPERID_BASE64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          APPLE_CERTIFICATE_DEVELOPERID_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: ./Scripts/ci-signing.sh setup --expect "${SIGNING_IDENTITY_DMG}" APPLE_CERTIFICATE_DEVELOPERID_BASE64

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # SIGNING_IDENTITY 由上面的脚本导出（= keychain 里那个 Developer ID 证书的全名）
      - name: Archive with Developer ID
        run: |
          # 这里**不能**传 PROVISIONING_PROFILE_SPECIFIER：它是全局构建设置，
          # 会连 SwiftPM 的 LinkPureCore_LinkPureCore 资源包一起要求 profile
          # （那是纯资源包，不支持 profile）。
          xcodebuild archive \
            -project LinkPure.xcodeproj \
            -scheme LinkPureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/dmg.xcarchive \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}"

      - name: Verify the archived app
        run: |
          APP=$(find build/dmg.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier=|flags='
          # 上 Mac App Store 要 universal；这个渠道也一并保持一致
          lipo -info "$APP/Contents/MacOS/$(basename "$APP" .app)"

      - name: Create DMG
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          APP=$(find build/dmg.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg
          create-dmg \
            --volname "LinkPure" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "$(basename "$APP")" 180 170 \
            --hide-extension "$(basename "$APP")" \
            --app-drop-link 480 170 \
            --codesign "${SIGNING_IDENTITY}" \
            "LinkPure-macos.dmg" \
            "$APP"
          codesign --verify --verbose=2 LinkPure-macos.dmg

      - name: Notarize and staple
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit LinkPure-macos.dmg \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait
          xcrun stapler staple LinkPure-macos.dmg
          # 盖章是真的成功了，而不是 notarytool 说成功
          xcrun stapler validate LinkPure-macos.dmg
          # Gatekeeper 的最终判定。放在这里当"附加证据"而不是硬门：
          # runner 上的 assess 守护进程状态偶尔会给出假阴性，而 stapler validate 已经过了。
          spctl -a -t open --context context:primary-signature -v LinkPure-macos.dmg \
            || echo "::warning::spctl 未通过（stapler validate 已通过，通常是 runner 上的 Gatekeeper 状态问题）"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: LinkPure-macos.dmg
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: ./Scripts/ci-signing.sh teardown

  # ───────────────────────── GitHub Release + Homebrew cask ─────────────────────────
  release:
    name: GitHub Release + Homebrew cask
    needs: [version, appstore, macos-dmg]
    # always()：needs 里有被跳过的 job 时，不加它就整个跳过
    if: >-
      always()
      && needs.version.outputs.publish == 'true'
      && needs.appstore.result == 'success'
      && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    environment: release-macOS
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${TAG} 已存在，只替换 DMG"
            gh release upload "$TAG" LinkPure-macos.dmg --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --generate-notes \
              --repo "${{ github.repository }}" \
              LinkPure-macos.dmg
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "::warning::TAP_GITHUB_TOKEN 未配置，跳过 cask 更新（DMG 已经发到 GitHub Release）"
            exit 0
          fi

          SHA256=$(sha256sum LinkPure-macos.dmg | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/rxliuli/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          if [[ -f Casks/linkpure.rb ]]; then
            # 只改这两行：cask 里可能有人手写的 livecheck / caveats / zap，别覆盖掉
            sed -i -E "s|^  version \".*\"$|  version \"${VERSION}\"|" Casks/linkpure.rb
            sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" Casks/linkpure.rb
          else
            cat > Casks/linkpure.rb <<RUBY
          cask "linkpure" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/rxliuli/LinkPure/releases/download/v#{version}/LinkPure-macos.dmg"
            name "LinkPure"
            desc "Rewrites clipboard URLs using user-defined rules"
            homepage "https://github.com/rxliuli/LinkPure"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sequoia"

            app "LinkPure.app"

            caveats <<~EOS
              这个 cask 装的是同一款 app 的直发版本，bundle id 与 Mac App Store 版相同
              （com.rxliuli.linkpure2）。两份同时装会互相覆盖，装之前请先卸掉另一份。
            EOS

            zap trash: [
              "~/Library/Containers/com.rxliuli.linkpure2",
              "~/Library/Preferences/com.rxliuli.linkpure2.plist",
              "~/Library/Saved Application State/com.rxliuli.linkpure2.savedState",
            ]
          end
          RUBY
          fi

          git add Casks/linkpure.rb
          if git diff --cached --quiet; then
            echo "cask 已经是 v${VERSION} / ${SHA256}，无需更新"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: bump linkpure to v${VERSION}"
          git push
